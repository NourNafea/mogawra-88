<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e201d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المجاورة ٨٨">
<title>خريطة المجاورة ٨٨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f2ee;
  --surface: #ffffff;
  --surface-2: #f8f7f4;
  --ink: #1d1f1c;
  --ink-2: #5d615b;
  --ink-3: #8b8f88;
  --border: #e3e0d9;
  --map-bg: #ebe8e1;
  --line: #9a9a92;
  --line-soft: #c9c6bd;
  --park: #cfe3c4;
  --park-line: #a9c99a;
  --services: #e4e0d4;
  --paid: #2f9a5a;
  --paid-soft: #e3f3e8;
  --unpaid: #d14b4b;
  --unpaid-soft: #fbe7e5;
  --units: #2f6fb5;
  --units-soft: #e3edf8;
  --union: #d9921f;
  --union-soft: #fbefd9;
  --none: #ffffff;
  --none-line: #7f8279;
  --focus: #1f5fbf;
  --label: #2b2d29;
  --label-on: #ffffff;
  --shadow: 0 10px 30px rgba(30, 30, 20, .12), 0 2px 6px rgba(30, 30, 20, .08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151614;
    --surface: #1e201d;
    --surface-2: #252723;
    --ink: #ecebe6;
    --ink-2: #b2b4ad;
    --ink-3: #888b84;
    --border: #33362f;
    --map-bg: #1a1c19;
    --line: #6d7068;
    --line-soft: #3d403a;
    --park: #24402b;
    --park-line: #335a3d;
    --services: #2a2c27;
    --paid: #3fb371;
    --paid-soft: #1d3326;
    --unpaid: #e2615f;
    --unpaid-soft: #3a2120;
    --units: #5b9be0;
    --units-soft: #1c2a3a;
    --union: #e3a53c;
    --union-soft: #3a2c15;
    --none: #2c2e2a;
    --none-line: #8b8e86;
    --focus: #6aa2ff;
    --label: #e6e5df;
    --label-on: #ffffff;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  --bg: #151614;
  --surface: #1e201d;
  --surface-2: #252723;
  --ink: #ecebe6;
  --ink-2: #b2b4ad;
  --ink-3: #888b84;
  --border: #33362f;
  --map-bg: #1a1c19;
  --line: #6d7068;
  --line-soft: #3d403a;
  --park: #24402b;
  --park-line: #335a3d;
  --services: #2a2c27;
  --paid: #3fb371;
  --paid-soft: #1d3326;
  --unpaid: #e2615f;
  --unpaid-soft: #3a2120;
  --units: #5b9be0;
  --units-soft: #1c2a3a;
  --union: #e3a53c;
  --union-soft: #3a2c15;
  --none: #2c2e2a;
  --none-line: #8b8e86;
  --focus: #6aa2ff;
  --label: #e6e5df;
  --label-on: #ffffff;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { body { height: 100dvh; } }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "IBM Plex Sans Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 20px;
  padding: 14px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; flex-direction: column; margin-inline-end: auto; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0; }
.brand p { margin: 0; color: var(--ink-2); font-size: 13px; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--ink); font: inherit; font-size: 14px; cursor: pointer;
  transition: background .15s, border-color .15s, opacity .15s;
}
.chip:hover { border-color: var(--ink-3); }
.chip[hidden] { display: none; }
.chip.export { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.chip.export:disabled { opacity: .6; cursor: progress; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--ink); }
.chip.dim { opacity: .5; }
.chip b { font-weight: 700; font-variant-numeric: tabular-nums; }
.dot { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.dot.paid { background: var(--paid); }
.dot.unpaid { background: var(--unpaid); }
.dot.units { background: var(--units); }
.dot.union { background: var(--union); }
.dot.none { background: var(--none); border: 1.5px solid var(--none-line); }
.search { position: relative; }
.search input {
  width: 240px; max-width: 100%;
  padding: 8px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--ink); font: inherit; font-size: 14px;
}
.search input:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.results {
  position: absolute; inset-inline-start: 0; top: calc(100% + 6px); z-index: 20;
  width: 100%; min-width: 240px; max-height: 300px; overflow: auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow); padding: 4px; display: none;
}
.results.open { display: block; }
.results button {
  display: flex; width: 100%; gap: 10px; align-items: center; text-align: start;
  padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: var(--ink);
  font: inherit; font-size: 14px; cursor: pointer;
}
.results button:hover, .results button.active { background: var(--surface-2); }
.results .num { font-weight: 700; min-width: 36px; font-variant-numeric: tabular-nums; }
.results .empty { padding: 10px; color: var(--ink-3); font-size: 13px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--ink);
  display: inline-grid; place-items: center; cursor: pointer; font: inherit; font-size: 18px;
}
.icon-btn:hover { border-color: var(--ink-3); }

main { flex: 1; position: relative; min-height: 0; display: flex; }
.map-wrap { position: relative; flex: 1; min-width: 0; background: var(--map-bg); overflow: hidden; touch-action: none; cursor: grab; }
.map-wrap.dragging { cursor: grabbing; }
svg#map { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
#bg .k { fill: none; stroke: var(--line); stroke-width: .35; stroke-linecap: round; stroke-linejoin: round; }
#bg .g { fill: none; stroke: var(--line-soft); stroke-width: .3; }
#bg .r { fill: none; stroke: var(--line-soft); stroke-width: .3; stroke-dasharray: 3 2; }
#bg .o { fill: var(--line-soft); opacity: .5; }
.park { fill: var(--park); stroke: var(--park-line); stroke-width: .4; }
.services { fill: var(--services); stroke: var(--line); stroke-width: .3; }
.area-label { fill: var(--ink-3); font-size: 9px; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }

.villa { cursor: pointer; }
.villa path { stroke-width: .45; stroke-linejoin: round; transition: opacity .15s; }
.villa.paid path { fill: var(--paid); stroke: var(--paid); }
.villa.unpaid path { fill: var(--unpaid); stroke: var(--unpaid); }
.villa.units path { fill: var(--units); stroke: var(--units); }
.villa.union path { fill: var(--union); stroke: var(--union); }
.villa.union text { fill: #2b1d00; }
.villa.none path { fill: var(--none); stroke: var(--none-line); }
.villa text { font-size: 5.6px; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; fill: var(--label); font-variant-numeric: tabular-nums; }
.villa.paid text, .villa.unpaid text, .villa.units text { fill: var(--label-on); }
.villa:hover path { stroke: var(--ink); stroke-width: 1; }
.villa.selected path { stroke: var(--focus); stroke-width: 1.6; }
.villa.faded { opacity: .18; }
.villa:focus { outline: none; }
.villa:focus-visible path { stroke: var(--focus); stroke-width: 1.6; }

.zoom { position: absolute; inset-inline-start: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
.zoom .icon-btn { background: var(--surface); box-shadow: var(--shadow); }

.tooltip {
  position: fixed; z-index: 30; pointer-events: none;
  background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow);
  font-size: 13px; min-width: 150px; max-width: 260px; opacity: 0; transform: translateY(4px);
  transition: opacity .1s, transform .1s;
}
.tooltip.show { opacity: 1; transform: none; }
.tooltip .t-num { font-weight: 700; font-size: 15px; }
.tooltip .t-name { color: var(--ink); }
.tooltip .t-status { display: flex; align-items: center; gap: 6px; color: var(--ink-2); margin-top: 2px; }

aside.sheet {
  width: 340px; flex: none; background: var(--surface); border-inline-start: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.sheet .panel { flex: 1; min-height: 0; overflow: auto; }
.peek { display: none; }
body { overscroll-behavior: none; }
.panel-empty { padding: 28px 22px; color: var(--ink-2); }
.panel-empty h2 { font-size: 16px; color: var(--ink); margin: 0 0 6px; }
.panel-empty p { margin: 0 0 14px; font-size: 14px; }
.progress { height: 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; display: flex; }
.progress span { display: block; height: 100%; }
.progress .p { background: var(--paid); }
.progress .u { background: var(--unpaid); }
.progress .a { background: var(--units); }
.progress .x { background: var(--union); }
.summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.summary div { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.summary b { display: block; font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }
.summary small { color: var(--ink-2); font-size: 12px; }

.detail { padding: 22px; }
.detail-head { display: flex; align-items: flex-start; gap: 12px; }
.detail-head .big { font-size: 34px; font-weight: 700; line-height: 1; }
.detail-head .lbl { color: var(--ink-3); font-size: 12px; }
.detail-head .close { margin-inline-start: auto; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; margin-top: 12px; }
.badge.paid { background: var(--paid-soft); color: var(--paid); }
.badge.unpaid { background: var(--unpaid-soft); color: var(--unpaid); }
.badge.units { background: var(--units-soft); color: var(--units); }
.badge.union { background: var(--union-soft); color: var(--union); }
.badge.none { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); }
dl { margin: 18px 0 0; display: grid; gap: 12px; }
dl div { border-bottom: 1px solid var(--border); padding-bottom: 10px; }
dt { color: var(--ink-3); font-size: 12px; }
dd { margin: 2px 0 0; font-size: 15px; word-break: break-word; }
dd a { color: var(--focus); text-decoration: none; direction: ltr; unicode-bidi: embed; }
.entry { margin-top: 18px; padding: 14px 14px 4px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); border-inline-start: 4px solid var(--none-line); }
.entry.paid { border-inline-start-color: var(--paid); }
.entry.unpaid { border-inline-start-color: var(--unpaid); }
.entry-name { font-size: 17px; font-weight: 700; }
.entry dl { margin-top: 10px; gap: 8px; }
.entry dl div:last-child { border-bottom: 0; }
.check { margin-top: 6px; font-size: 12.5px; color: #a86b00; }
:root[data-theme="dark"] .check { color: #f0b54a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .check { color: #f0b54a; } }
.multi { margin: 12px 0 0; color: var(--ink-2); font-size: 13px; }
.nodata { margin-top: 18px; padding: 14px; border-radius: 10px; background: var(--surface-2); border: 1px dashed var(--border); color: var(--ink-2); font-size: 14px; }
.neighbours { margin-top: 18px; display: flex; gap: 8px; }
.neighbours .chip { font-size: 13px; }

@media (max-width: 820px) {
  header { padding: 12px 16px; gap: 10px; }
  .brand h1 { font-size: 18px; }
  .brand p { display: none; }
  .stats { order: 4; flex-basis: calc(100% + 32px); flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
  .stats::-webkit-scrollbar { display: none; }
  .stats .chip { flex: none; font-size: 13px; padding: 5px 10px; }
  .chip.export { font-size: 13px; padding: 6px 10px; }
  .search, .search input { width: 100%; }
  .search { order: 5; flex-basis: 100%; }
  .search input { font-size: 16px; } /* 16px stops iOS zooming on focus */
  header { padding-top: max(12px, env(safe-area-inset-top)); }
  main { flex-direction: column; }
  .map-wrap { margin-bottom: calc(62px + env(safe-area-inset-bottom)); }
  .zoom { inset-inline-start: 12px; bottom: 12px; }
  .zoom .icon-btn { width: 44px; height: 44px; font-size: 20px; }
  aside.sheet {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 12; width: auto;
    max-height: 72vh; max-height: 72dvh;
    border: 1px solid var(--border); border-bottom: 0; border-radius: 18px 18px 0 0;
    box-shadow: 0 -8px 30px rgba(0, 0, 0, .18);
    transform: translateY(calc(100% - 62px - env(safe-area-inset-bottom)));
    transition: transform .28s cubic-bezier(.2, .8, .2, 1);
  }
  aside.sheet.open { transform: none; }
  .peek {
    display: flex; flex-direction: column; align-items: center; gap: 7px; flex: none;
    width: 100%; height: 62px; padding: 8px 16px 0; border: 0; background: none;
    color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .peek .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--ink-3); opacity: .5; }
  .sheet .panel { overscroll-behavior: contain; padding-bottom: env(safe-area-inset-bottom); }
  .neighbours .chip { padding: 8px 14px; }
  .detail, .panel-empty { padding: 16px; }
  .tooltip { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>خريطة المجاورة ٨٨</h1>
    <p>٣٣٧ فيلا — مرّر المؤشر على أي فيلا أو اضغط عليها لعرض بيانات المالك</p>
  </div>
  <div class="stats" role="group" aria-label="تصفية حسب حالة السداد">
    <button class="chip" data-filter="paid" aria-pressed="false"><span class="dot paid"></span>سدّد <b id="c-paid">٠</b></button>
    <button class="chip" data-filter="union" aria-pressed="false"><span class="dot union"></span>اتحاد ملاك <b id="c-union">٠</b></button>
    <button class="chip" data-filter="units" aria-pressed="false"><span class="dot units"></span>سدّد بالشقق <b id="c-units">٠</b></button>
    <button class="chip" data-filter="unpaid" aria-pressed="false"><span class="dot unpaid"></span>لم يسدّد <b id="c-unpaid">٠</b></button>
    <button class="chip" data-filter="none" aria-pressed="false"><span class="dot none"></span>لا توجد بيانات <b id="c-none">٠</b></button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="ابحث برقم الفيلا أو اسم المالك" autocomplete="off" aria-label="بحث">
    <div class="results" id="results" role="listbox"></div>
  </div>
  <button class="chip export" id="export" title="تحميل ما يظهر على الشاشة الآن كملف PDF">⤓ تصدير PDF</button>
  <button class="icon-btn" id="theme" title="تبديل الوضع الليلي" aria-label="تبديل الوضع الليلي">◐</button>
</header>
<main>

const entriesOf = n => { const o = OWNERS[n]; return !o ? [] : Array.isArray(o) ? o : [o]; };

  const isUnion = o => /اتحاد\s*ملاك/.test(o.notes || '');
  const whole = es.filter(o => !o.unit && entryPaid(o) === true);
  if (whole.length) return whole.every(isUnion) ? 'union' : 'paid';
  if (es.some(o => o.unit && entryPaid(o) === true)) return 'units';

{

function refresh() {
  const counts = { paid: 0, union: 0, units: 0, unpaid: 0, none: 0 };
  for (const [n, { g }] of byNum) {
    const s = statusOf(n);
    counts[s]++;
    g.classList.remove('paid', 'union', 'units', 'unpaid', 'none');
    g.classList.add(s);
    const names = namesOf(n);
    g.setAttribute('aria-label', `فيلا ${toAr(n)} — ${names.length ? names.join('، ') + ' — ' : ''}${STATUS_TEXT[s]}`);
  }
  for (const k in counts) document.getElementById('c-' + k).textContent = toAr(counts[k]);
  // Hide the "unpaid" chip while nobody is marked unpaid.
  document.querySelector('.chip[data-filter="unpaid"]').hidden = counts.unpaid === 0;
  window.__counts = counts;
  applyFilter();
  if (selected) showDetail(selected); else showSummary();
}

// ---- search ----
const q = document.getElementById('q'), results = document.getElementById('results');
let hits = [], active = 0;
function runSearch() {
  const s = norm(q.value);
  if (!s) { results.classList.remove('open'); return; }
  hits = [];
  for (const v of VILLAS) {
    const digits = s.replace(/\D/g, '');
    const match = String(v.n) === s || String(v.n).startsWith(s) || entriesOf(v.n).some(o =>
      (o.name && norm(o.name).includes(s)) || (digits.length >= 4 && o.phone && toEn(o.phone).replace(/\D/g, '').includes(digits)));
    if (match) hits.push(v.n);
  }
  hits.sort((a, b) => (String(a) === s ? -1 : String(b) === s ? 1 : a - b));
  hits = hits.slice(0, 30); active = 0;
  results.innerHTML = hits.length ? hits.map((n, i) => {
    const nm = namesOf(n), st = statusOf(n);
    return `<button role="option" class="${i === 0 ? 'active' : ''}" data-n="${n}"><span class="dot ${st}"></span><span class="num">${toAr(n)}</span><span>${nm.length ? esc(nm.join('، ')) : '<span style="color:var(--ink-3)">لا توجد بيانات</span>'}</span></button>`;
  }).join('') : '<div class="empty">لا توجد نتائج</div>';
  results.classList.add('open');
}
q.addEventListener('input', runSearch);
q.addEventListener('keydown', e => {
  const btns = [...results.querySelectorAll('button')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!btns.length) return;
    active = (active + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length;
    btns.forEach((b, i) => b.classList.toggle('active', i === active));
    btns[active].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter' && btns[active]) {
    select(Number(btns[active].dataset.n), true); results.classList.remove('open'); q.blur();
  } else if (e.key === 'Escape') { results.classList.remove('open'); }
});
results.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  select(Number(b.dataset.n), true); results.classList.remove('open');
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) results.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && selected) select(null); });

// ---- export current view as PDF ----
const FILTER_TEXT = { paid: 'سدّد', union: 'اتحاد ملاك', units: 'سدّد بالشقق', unpaid: 'لم يسدّد', none: 'لا توجد بيانات' };
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
// The rectangle of the plan that is actually visible on screen (wider than the viewBox when the window is wider).
function visibleBox() {
  const r = svg.getBoundingClientRect();
  const s = Math.max(vb[2] / r.width, vb[3] / r.height);
  const w = r.width * s, h = r.height * s;
  return [vb[0] + vb[2] / 2 - w / 2, vb[1] + vb[3] / 2 - h / 2, w, h];
}
// Serialise the map with every computed style written inline, so it renders the same as an image.
function snapshotSVG(box, pxW, pxH) {
  const clone = svg.cloneNode(true);
  const props = ['fill', 'fill-opacity', 'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-linecap', 'stroke-linejoin',
    'opacity', 'font-size', 'font-weight', 'text-anchor', 'dominant-baseline'];
  const a = svg.querySelectorAll('*'), b = clone.querySelectorAll('*');
  for (let i = 0; i < a.length; i++) {
    const cs = getComputedStyle(a[i]);
    b[i].setAttribute('style', props.map(p => `${p}:${cs.getPropertyValue(p)}`).join(';') + ';font-family:"Geeza Pro","Arial",sans-serif');
    b[i].removeAttribute('class');
  }
  clone.setAttribute('viewBox', box.join(' '));
  clone.setAttribute('width', pxW); clone.setAttribute('height', pxH);
  clone.setAttribute('xmlns', SVGNS);
  return new XMLSerializer().serializeToString(clone);
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
async function exportPDF() {
  const btn = document.getElementById('export'), label = btn.textContent;
  btn.disabled = true; btn.textContent = 'جارٍ التصدير…';
  const root = document.documentElement, prevTheme = root.dataset.theme;
  const sel = selected;
  try {
    // Always export in the light theme, without the selection outline.
    root.dataset.theme = 'light';
    if (sel) byNum.get(sel).g.classList.remove('selected');
    tip.classList.remove('show');
    const css = getComputedStyle(root), col = k => css.getPropertyValue(k).trim();
    const W = 3508, H = 2480, M = 130;           // A4 landscape at 300 dpi
    const top = 450, bottom = 110;
    const box = visibleBox();
    const areaW = W - 2 * M, areaH = H - top - bottom;
    const k = Math.min(areaW / box[2], areaH / box[3]);
    const mw = Math.round(box[2] * k), mh = Math.round(box[3] * k);
    const svgText = snapshotSVG(box, mw, mh);
    const legend = [['paid', col('--paid')], ['union', col('--union')], ['units', col('--units')], ['unpaid', col('--unpaid')], ['none', col('--none-line')]];
    const counts = window.__counts || {};
    const mapBg = col('--map-bg') || '#ebe8e1';
    if (sel) byNum.get(sel).g.classList.add('selected');
    if (prevTheme) root.dataset.theme = prevTheme; else delete root.dataset.theme;

    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText); });
    try { await document.fonts.ready; } catch (_) {}
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    const FONT = '"IBM Plex Sans Arabic", "Geeza Pro", Tahoma, sans-serif';
    ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#1d1f1c'; ctx.font = `700 92px ${FONT}`;
    ctx.fillText('خريطة المجاورة ٨٨ — حالة السداد', W - M, M + 80);
    const date = new Date().toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' });
    ctx.fillStyle = '#5d615b'; ctx.font = `400 48px ${FONT}`;
    ctx.fillText(`بتاريخ ${date}${filter ? ` — المعروض: ${FILTER_TEXT[filter]} فقط` : ''}`, W - M, M + 160);
    // legend with counts
    let x = W - M; const ly = M + 255;
    ctx.font = `500 50px ${FONT}`;
    for (const [key, color] of legend) {
      if (!counts[key]) continue;
      const text = `${STATUS_TEXT[key]}: ${toAr(counts[key])}`;
      ctx.fillStyle = key === 'none' ? '#ffffff' : color;
      roundRect(ctx, x - 50, ly - 42, 50, 50, 10); ctx.fill();
      if (key === 'none') { ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.stroke(); }
      ctx.fillStyle = '#1d1f1c'; ctx.fillText(text, x - 72, ly);
      x -= 72 + ctx.measureText(text).width + 80;
    }
    // map
    const mx = M + (areaW - mw) / 2, my = top + (areaH - mh) / 2;
    ctx.fillStyle = mapBg; ctx.fillRect(mx, my, mw, mh);
    ctx.drawImage(img, mx, my, mw, mh);
    ctx.strokeStyle = '#d6d2c8'; ctx.lineWidth = 3; ctx.strokeRect(mx, my, mw, mh);

    const day = new Date().toISOString().slice(0, 10);
    const name = `خريطة-المجاورة-88-${day}`;
    try {
      if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true });
      pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 297, 210);
      pdf.save(name + '.pdf');
    } catch (_) {
      // No internet for the PDF library: fall back to a PNG of the same page.
      const a = document.createElement('a'); a.download = name + '.png'; a.href = cv.toDataURL('image/png'); a.click();
    }
    btn.textContent = 'تم التصدير ✓';
  } catch (e) {
    console.error(e);
    if (prevTheme) root.dataset.theme = prevTheme; else delete root.dataset.theme;
    if (sel && byNum.has(sel)) byNum.get(sel).g.classList.add('selected');
    btn.textContent = 'تعذّر التصدير';
  } finally {
    setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 1800);
  }
}
document.getElementById('export').addEventListener('click', exportPDF);

// ---- theme ----
const themeBtn = document.getElementById('theme');
try { const t = localStorage.getItem('m88-theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
themeBtn.onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('m88-theme', next); } catch (_) {}
};

refresh();
const deep = Number(toEn(location.hash.slice(1)));
if (byNum.has(deep)) select(deep, true);
</script>
